# One-off: Google Maps search (gosom scraper, CLI mode) for uPVC window makers around Trivandrum.
# Prints mobile-number leads to the logs as "LEAD name|phone|rating|reviews|category|address". No secrets.
services:
  scrape:
    image: gosom/google-maps-scraper:latest
    restart: "no"
    configs:
      - source: queries
        target: /in/queries.txt
    volumes:
      - out:/out
    command: ["-input", "/in/queries.txt", "-results", "/out/results.csv", "-depth", "2", "-c", "2", "-lang", "en", "-exit-on-inactivity", "3m"]
  parse:
    image: node:22-bookworm-slim
    restart: "no"
    volumes:
      - out:/out
    configs:
      - source: parse_mjs
        target: /app/parse.mjs
    command: ["node", "/app/parse.mjs"]
volumes:
  out:
configs:
  queries:
    content: |
      upvc windows in Thiruvallam, Thiruvananthapuram
      upvc windows in Kovalam, Kerala
      upvc windows in Vizhinjam, Kerala
      upvc windows in Balaramapuram, Kerala
      upvc windows in Neyyattinkara, Kerala
      upvc windows in Nemom, Thiruvananthapuram
      upvc windows in Pappanamcode, Thiruvananthapuram
      upvc windows in Karamana, Thiruvananthapuram
      upvc windows in Thiruvananthapuram
      upvc doors and windows Trivandrum
      upvc fabricators Trivandrum
      upvc window manufacturers Trivandrum
      upvc windows in Kazhakoottam, Kerala
      upvc windows in Sreekaryam, Kerala
      upvc windows in Peroorkada, Kerala
      upvc windows in Nedumangad, Kerala
      upvc windows in Attingal, Kerala
      upvc windows in Venjaramoodu, Kerala
      upvc windows in Kattakada, Kerala
      upvc windows in Parassala, Kerala
      upvc windows in Marthandam, Tamil Nadu
      upvc windows in Nagercoil, Tamil Nadu
      upvc windows in Kollam, Kerala
  parse_mjs:
    content: |
      import fs from 'node:fs';
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const F = '/out/results.csv';
      function csv(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}const[h,...r]=rows;return r.filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,j)=>[k,x[j]??''])))}
      const norm=(p)=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===11&&d[0]==='0')d=d.slice(1);if(d.length===10)d='91'+d;return /^91[6-9]\d{9}$$/.test(d)?d:null};
      const SKIP=new Set(['916379762261','919446168654','916238632112','918590000847','917356807111','916282529090','917012807400','919074538991','919500895005','919895594074']);
      let last=0,stable=0;
      for(let i=0;i<240;i++){await sleep(15000);let s=0;try{s=fs.statSync(F).size}catch{}if(s&&s===last){if(++stable>=8)break}else stable=0;last=s}
      const rows=csv(fs.readFileSync(F,'utf8'));const seen=new Set();let n=0;
      for(const r of rows){const ph=norm(r.phone);const txt=`$${r.title} $${r.category}`.toLowerCase();
        if(!ph||SKIP.has(ph)||seen.has(ph)||/closed/i.test(r.status||''))continue;
        if(!/upvc|u-pvc|window|door|fenestration|glass|aluminium|aluminum/.test(txt))continue;
        seen.add(ph);n++;console.log(`LEAD $${r.title}|$${ph}|$${r.review_rating||''}|$${r.review_count||''}|$${r.category||''}|$${(r.address||'').slice(0,80)}`)}
      console.log(`DONE rows=$${rows.length} leads=$${n}`);
      await sleep(3600000);
